	stroke-linecap: miter;
}
rect.pointer {
	fill: #A89968;
}
text {
	font-family: sans-serif;
	font-size: 18pt;
	fill: black;
	text-anchor: middle;
	dominant-baseline: middle;
}

circle.pointer {
	fill: #dfdfd6;
	stroke: none;
}

line {
	stroke: #dfdfd6;
	stroke-width: 2.5pt;
	stroke-linecap: none;
}
</style>

